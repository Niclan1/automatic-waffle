[package]
name = "catalog-core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
semver = "1"
symphonia = { version = "0.5.5", default-features = false, features = ["mp3", "wav", "pcm", "ogg", "vorbis"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Request", "RequestInit", "RequestCache", "Response", "ReadableStream", "ReadableStreamDefaultReader", "AbortSignal", "Blob", "BlobPropertyBag", "HtmlMediaElement"] }
