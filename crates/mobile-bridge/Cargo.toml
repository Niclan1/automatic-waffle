[package]
name = "volkspele-logic"
version = "0.1.0"
edition = "2021"
[lib]
name = "volkspele_logic"
crate-type = ["cdylib", "staticlib", "rlib"]
[dependencies]
catalog-core = { path = "../catalog-core" }
serde_json = "1"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
